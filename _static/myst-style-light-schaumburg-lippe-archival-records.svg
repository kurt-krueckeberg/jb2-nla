<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="144" viewBox="0 0 1360 144" role="img" aria-labelledby="title desc">
  <title id="title">Schaumburg-Lippe Archival Records logo</title>
  <desc id="desc">A transparent SVG wordmark with curly braces around the text Schaumburg-Lippe Archival Records, styled with MyST-inspired blue and orange colors for light mode.</desc>
  <style>
    .logo {
      font-family: "Roboto Slab", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .brace-light {
      fill: #F37726;
      font-size: 80px;
    }
    .word-light {
      fill: #616161;
      font-size: 67px;
    }
  </style>
  <rect width="100%" height="100%" fill="none"/>
  <text class="logo" x="24" y="94" xml:space="preserve">
    <tspan class="brace-light">{</tspan><tspan class="word-light" dx="18">Schaumburg-Lippe Archival Records</tspan><tspan class="brace-light" dx="18">}</tspan>
  </text>
</svg>
